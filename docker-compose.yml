services:
  bookify.api:
    image: ${DOCKER_REGISTRY-}bookifyapi
    container_name: Bookify.Api
    environment:
      - ConnectionStrings__Database=Host=bookify-db;Port=5432;Database=bookify;Username=postgres;Password=postgres;
    build:
      context: .
      dockerfile: Bookify.Api/Dockerfile
    depends_on:
      bookify-db:
        condition: service_healthy

  bookify-db:
    image: postgres:17
    container_name: Bookify.db
    environment:
      - POSTGRES_DB=bookify
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - bookify-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "bookify"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - 5432:5432
  
    # DESARROLLO: la configuracion activa de abajo no es de produccion.
    # PRODUCCION: ejemplo independiente, una instancia y HTTPS directo.
    # Crear un Compose separado con este bloque SIN comentarios. No mezclar
    # con docker-compose.override.yml, ni con environment/ports/volumes locales.
    # Requiere DNS, puerto 443 libre, certificado valido y PostgreSQL preparado.
    # Detalles, variables y verificaciones en Bookify.Api/readme.md.
